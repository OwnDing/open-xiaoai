# Hermes profile "xiaoqi-home": the voice brain behind Xiaozhi.
# Copied to /opt/data/profiles/xiaoqi-home/config.yaml by setup.sh.

model:
  provider: deepseek
  default: deepseek-flash

agent:
  # Voice replies must start fast: never let DeepSeek think first.
  reasoning_effort: none
  # A household request should never need a long tool loop.
  max_turns: 8
  api_max_retries: 1
  # Never available to any agent of this profile, including a scheduled job
  # that names them in its own enabled_toolsets (which overrides
  # platform_toolsets.cron below). Composite sets such as "debugging" stay
  # off this list: they also carry web search, and their risky members are
  # listed individually.
  disabled_toolsets:
    - terminal
    - file
    - code_execution
    - browser
    - computer_use
    - delegation
    - coding
    - kanban
    - image_gen
    - video_gen
    - vision
    - tts
    - todo
    - connections

# Only the tools the speaker needs. Everything else (terminal, files, browser,
# code execution, delegation, computer use...) stays off for safety and to keep
# the tool schema short.
platform_toolsets:
  api_server:
    - memory
    - session_search
    - skills
    - web
    - homeassistant
    - cronjob
  # Scheduled jobs run unattended with auto-approval, from prompts written by
  # the voice agent: give them Home Assistant only. Left unset, cron would get
  # the full default set (terminal, files, code execution, browser...).
  cron:
    - homeassistant

# Voice-taught scenes and linkages (stored as Home Assistant scripts and
# automations) plus the script.xiaoqi_announce speaker script; see
# mcp/home_rules. Only these two variables reach the server processes.
mcp_servers:
  home_rules:
    command: /opt/hermes/.venv/bin/python
    args: ["-m", "home_rules.server"]
    cwd: /opt/data/mcp
    env:
      HASS_URL: "${HASS_URL}"
      HASS_TOKEN: "${HASS_TOKEN}"
    # No generic resource/prompt helper tools: the server only offers its five tools.
    tools:
      resources: false
      prompts: false
  # Read-only device history from the HA recorder ("鱼缸灯今天亮了多久"); see
  # mcp/home_history. Cron jobs get it too: Hermes adds every MCP server to a
  # job's enabled_toolsets.
  home_history:
    command: /opt/hermes/.venv/bin/python
    args: ["-m", "home_history.server"]
    cwd: /opt/data/mcp
    env:
      HASS_URL: "${HASS_URL}"
      HASS_TOKEN: "${HASS_TOKEN}"
    tools:
      resources: false
      prompts: false
  # The household's music library, played on the living-room speaker by the
  # open-xiaoai bridge (see mcp/xiaoqi_music). Plain requests ("播放……",
  # "暂停") are handled before the model; these tools cover vague requests
  # and scheduled music.
  xiaoqi_music:
    command: /opt/hermes/.venv/bin/python
    args: ["-m", "xiaoqi_music.server"]
    cwd: /opt/data/mcp
    env:
      MUSIC_URL: "http://host.docker.internal:4400"
    tools:
      resources: false
      prompts: false

memory:
  memory_enabled: true
  user_profile_enabled: true

skills:
  # The speaker should not spontaneously author skills mid-conversation.
  creation_nudge_interval: 0

display:
  # Voice has no UI for tool-progress commentary.
  interim_assistant_messages: false

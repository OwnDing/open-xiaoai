# One file per terminal. Relative paths are relative to this file.

[terminal]
name = "书房蓝牙音箱"
# Unique per terminal. The backend keys its per-device settings on this ID
# (voice_devices in data/.config.yaml: server audio, TTS, room, reply style).
# A locally administered MAC-style value.
device_id = "02:76:74:00:00:01"

[server]
websocket_url = "ws://127.0.0.1:18100/xiaozhi/v1/"
access_token = ""

[audio]
# Names as `python -m voice_terminal devices --host-api WASAPI` prints them.
input = "耳机 (京鱼座蓝牙小黑胶)"
output = "耳机 (京鱼座蓝牙小黑胶)"
host_api = "WASAPI"
# P0.5 corpus: high-pass + WebRTC noise suppression + gain did best on this mic.
frontend = ["hpf", "ns", "agc"]
output_gain = 1.0
# After the speaker runs dry, queue this much before playing again (avoids crackle).
playback_buffer_ms = 240
# Only exact zeros from the mic this long: reopen the devices (0 disables).
silent_reopen_s = 10
# Still only zeros after the reopen: restart the mic's driver, then reopen
# (repeated every 5 minutes while it lasts). -Name is [audio] input.
silent_recover_command = 'powershell -NoProfile -ExecutionPolicy Bypass -File scripts\restart-audio-device.ps1 -Name "耳机 (京鱼座蓝牙小黑胶)"'

[wake]
keywords = ["你好小七"]
model_dir = "models/kws"
# The bridge uses 0.2; the 8 kHz Bluetooth mic needs a looser threshold.
threshold = 0.05
score = 2.0
# Wider beam and four streams 80 ms apart: on this mic 14 of 20 recorded
# "你好小七" wake instead of 9 (8 paths, one stream). Each stream costs as much CPU
# (four: about half of one N100 core; [0, 160] gets 11 of 20 for a quarter).
max_active_paths = 16
stream_offsets_ms = [0, 80, 160, 240]

[vad]
model = "models/silero_vad.onnx"
# Speech from the 8 kHz Bluetooth mic often scores only 0.5-0.8; at 0.5 some
# requests after waking were never sent.
threshold = 0.3
min_speech_ms = 250
min_silence_ms = 500
short_utterance_ms = 800
short_utterance_silence_ms = 1000
pre_roll_ms = 800
max_utterance_s = 15

[session]
idle_timeout_s = 20
# Echo of the speaker's own voice: ~210 ms round trip + ~500 ms room tail (Bluetooth).
tts_end_guard_ms = 700
no_reply_timeout_s = 6
reply_timeout_s = 90
# Made by scripts/fetch-assets.ps1 in the same Edge voice as the answers
# (-PromptEngine sherpa makes WAV files in the Sherpa voice instead).
wake_prompt = "prompts/wake.mp3"
no_reply_prompt = "prompts/no_reply.mp3"
goodbye_prompt = "prompts/goodbye.mp3"

[control]
host = "127.0.0.1"
port = 18110
